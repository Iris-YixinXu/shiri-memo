name: Publish 拾日

on:
  push:
    branches: [main]
  schedule:
    # 00:07 in Asia/Shanghai.
    - cron: "7 16 * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - name: Prepare the daily quote
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 .github/scripts/daily_quote.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: memo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
