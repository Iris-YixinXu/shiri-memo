name: Publish 拾日

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Set the public account configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path

          def public_key(value):
              if value.startswith("sb_publishable_"):
                  return value
              try:
                  claims = value.split(".")[1]
                  claims += "=" * (-len(claims) % 4)
                  if json.loads(base64.urlsafe_b64decode(claims)).get("role") == "anon":
                      return value
              except (IndexError, ValueError, TypeError, AttributeError):
                  pass
              return ""

          url = os.environ["SUPABASE_URL"].strip()
          if not re.fullmatch(r"https://[a-z0-9-]+\.supabase\.co/?", url):
              url = ""
          key = public_key(os.environ["SUPABASE_PUBLISHABLE_KEY"].strip())
          Path("memo/online-config.js").write_text(
              f"const SHIRI_SUPABASE_URL = {json.dumps(url)};\n"
              f"const SHIRI_SUPABASE_PUBLISHABLE_KEY = {json.dumps(key)};\n",
              encoding="utf-8",
          )
          page = Path("memo/index.html")
          html = page.read_text(encoding="utf-8")
          version = os.environ["GITHUB_RUN_ID"]
          page.write_text(html.replace('src="./online-config.js"', f'src="./online-config.js?v={version}"'), encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: memo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
